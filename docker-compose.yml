services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: karnataka-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - karnataka-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: karnataka-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - karnataka-network
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public

networks:
  karnataka-network:
    driver: bridge
